<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAJE Test - Jumping Square</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #game_box {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
  <script src="./jquery.min.js"></script>
  <script src="./bobs_completely_adequate_js_game_engine.js"></script>
</head>
<body>
  <div id="game_box"></div>

  <script>
    // Workaround: Define sprites and loc globally before the engine runs
    var sprites = [];
    var loc = { x: 0, y: 0 }; // Initialize loc for camera position

    // Game setup
    var game = new Game(window.innerWidth, window.innerHeight);

    // Workaround: Fix createBg to use this.ctx and store bg
    game.createBg = function() {
      this.ctx.fillStyle = "#6dab51";
      this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

      var grassCols = ["#65a24a", "#6ba950", "#669f4d", "#6ca453"];
      for (var x = 0; x < this.canvas.width; x++) {
        for (var y = 0; y < this.canvas.height; y++) {
          this.ctx.fillStyle = grassCols[Math.floor(Math.random() * 4)];
          this.ctx.fillRect(x, y, 1, 1);
        }
      }

      var bgURL = this.canvas.toDataURL();
      this.bg = new Sprite({
        url: bgURL,
        tileWidth: this.canvas.width,
        tileHeight: this.canvas.height,
        x: this.canvas.width / 2,
        y: this.canvas.height / 2,
        loner: true
      });
    };

    // Workaround: Fix drawBg to use game.bg and game.ctx
    drawBg = function(ratio) {
      game.bg.draw(game.ctx);
    };

    // Workaround: Fix render to use game.ctx
    render = function(ratio) {
      drawBg(ratio);
      for (var i = 0; i < sprites.length; i++) {
        sprites[i].update(ratio);
      }
      sprites.sort((a, b) => { return a.y - b.y; });
      game.ctx.save();
      game.ctx.translate(Math.floor(loc.x), Math.floor(loc.y));
      for (var i = 0; i < sprites.length; i++) {
        sprites[i].draw(game.ctx);
      }
      game.ctx.restore();
    };

    game.createBg(); // Call the fixed createBg

    var GRAVITY = 0.5; // Positive to pull downward
    var JUMP_SPEED = -10; // Negative to jump upward
    var MOVE_SPEED = 3;

    // Player square (red, controlled by arrow keys and space)
    var player = new Sprite({
      x: 100,
      y: game.gameHeight - 50, // Near the bottom (floor)
      tileWidth: 30,
      tileHeight: 30,
      color: "#FF0000",
      checkMove: function(sprite, nx, ny) {
        return sprite.hitTestList(nx, ny, obstacles);
      },
      onUpdate: function(frameRatio) {
        player.speedy += GRAVITY * frameRatio; // Apply gravity downward
        player.y += player.speedy * frameRatio; // Update y position based on speedy
        // Camera follows player
        loc.x = -player.x + game.gameWidth / 2;
      }
    });

    // Obstacles (static blue squares on the floor)
    var obstacles = [
      new Sprite({
        x: 200,
        y: game.gameHeight - 25, // On the floor
        tileWidth: 50,
        tileHeight: 50,
        color: "#0000FF"
      }),
      new Sprite({
        x: 300,
        y: game.gameHeight - 75, // Slightly above the floor
        tileWidth: 50,
        tileHeight: 100,
        color: "#0000FF"
      }),
      new Sprite({
        x: 450,
        y: game.gameHeight - 25, // On the floor
        tileWidth: 50,
        tileHeight: 50,
        color: "#0000FF"
      })
    ];

    // Moving grey square (controlled by Z key for jumping)
    var greySquare = new Sprite({
      x: 0,
      y: game.gameHeight - 15, // On the floor
      tileWidth: 20,
      tileHeight: 20,
      color: "#808080",
      checkMove: function(sprite, nx, ny) {
        return sprite.hitTestList(nx, ny, obstacles);
      },
      onUpdate: function(frameRatio) {
        // Move horizontally
        greySquare.speedx = 2; // Constant rightward movement
        greySquare.x += greySquare.speedx * frameRatio; // Update x position
        // Apply gravity downward
        greySquare.speedy += GRAVITY * frameRatio;
        greySquare.y += greySquare.speedy * frameRatio; // Update y position based on speedy
        // Wrap around screen
        if (greySquare.x > game.gameWidth) {
          greySquare.x = 0;
        }
      }
    });

    // Add sprites to the global sprites array
    sprites.push(player);
    sprites.push(greySquare);
    obstacles.forEach(function(obstacle) {
      sprites.push(obstacle);
    });

    // Input handling
    document.addEventListener("keydown", function(e) {
      switch (e.key) {
        case "ArrowLeft":
          player.speedx = -MOVE_SPEED;
          player.flip = true;
          break;
        case "ArrowRight":
          player.speedx = MOVE_SPEED;
          player.flip = false;
          break;
        case " ":
          if (player.onGround) {
            player.speedy = JUMP_SPEED; // Jump upward
            player.y!=1;
            player.onGround = false;
          }
          break;
        case "z":
        case "Z":
          if (greySquare.onGround) {
            greySquare.speedy = JUMP_SPEED; // Jump upward
            greySquare.onGround = false;
          }
          break;
      }
    });

    document.addEventListener("keyup", function(e) {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        player.speedx = 0;
      }
    });

    // Override game_tic to enforce floor at y = game.gameHeight (bottom of screen)
    game_tic = function() {
      // Enforce floor at bottom of screen for all non-loner sprites
      for (var i = 0; i < sprites.length; i++) {
        var sprite = sprites[i];
        if (sprite.y > game.gameHeight - sprite.height() / 2) { // Floor at y = game.gameHeight
          sprite.y = game.gameHeight - sprite.height() / 2;
          sprite.speedy = 0;
          sprite.onGround = true;
        } else {
          sprite.onGround = false;
        }
      }
    };
  </script>
</body>
</html>
